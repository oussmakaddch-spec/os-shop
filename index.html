if(tab=='p')c=`<div class="box"><h2>${ic('user')} ${esc(u.name)}</h2><div class="f"><div><label>${t('fn')}</label><input id="fn" value="${esc(u.fn)}"></div><div><label>${t('ln')}</label><input id="ln" value="${esc(u.ln)}"></div><div><label>${t('ph')}</label><input id="ph" dir="ltr" value="${esc(u.phone)}"></div><div><label>${t('wil')}</label><select id="wl" onchange="fillCom('ct',this.value,'','name_fr')"><option value="">${t('choose')}</option>${W.map(w=>`<option ${u.wilaya==w[0]?'selected':''}>${w[0]}</option>`).join('')}</select></div><div><label>${t('city')}</label><select id="ct"><option value="">${t('choose')}</option></select></div><div><label>${t('dt')}</label><select id="dt"><option value="home" ${u.dtype!='office'?'selected':''}>${t('hm')}</option><option value="office" ${u.dtype=='office'?'selected':''}>${t('of')}</option></select></div></div><button class="btn" style="margin-top:12px" onclick="svp()">${t('save')}</button></div>`;
else if(tab=='n'){c=`<div class="box"><h2>${ic('bell')} ${t('tn')}</h2>${ns.length?ns.map(n=>`<div class="row ${n.read?'':'un'}"><div class="t">${esc(t(n.k).replace('{0}',n.p))}<br><small style="color:var(--mu)">${new Date(n.created_at).toLocaleString(loc())}</small></div></div>`).join(''):`<div class="empty"><span class="i">${ic('bell')}</span>${t('nonot')}</div>`}</div>`;if(unread())sb.from('os_notifs').update({read:true}).eq('user_id',me.id).eq('read',false).then(()=>{notifs.forEach(n=>n.read=true);nav()})}
else c=`<div class="box"><h2>${ic('sliders')} ${t('ts')}</h2><div class="f"><div><label>${t('lang')}</label><select onchange="setLang(this.value)"><option value="ar" ${lang=='ar'?'selected':''}>العربية</option><option value="fr" ${lang=='fr'?'selected':''}>Français</option><option value="en" ${lang=='en'?'selected':''}>English</option></select></div><div><label>${t('notson')}</label><select onchange="upd({no_notif:this.value=='0'})"><option value="1">ON</option><option value="0" ${u.no_notif?'selected':''}>OFF</option></select></div></div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn o" onclick="switchRole()">${isS()?ic('bag')+' '+t('mkb'):ic('store')+' '+t('mks')}</button><button class="btn r" onclick="out()">${ic('logout')} ${t('logout')}</button></div></div>`;
$('#app').innerHTML=`<div class="tabs">${tb.map(([k,f])=>`<button class="btn ${tab==k?'':'o'}" onclick="tab='${k}';account()">${f}</button>`).join('')}</div>`+c;if(tab=='p')fillCom('ct',u.wilaya,u.commune,'name_fr')}
async function upd(o){const {error}=await sb.from('os_profiles').update(o).eq('id',me.id);if(error)return err(error);Object.assign(me,o);toast(t('saved'))}
async function switchRole(){const r=isS()?'buyer':'seller';await upd({role:r});if(r=='seller')await Promise.all([loadSell(),loadLinks()]);route()}
function svp(){const o={fn:$('#fn').value.trim(),ln:$('#ln').value.trim(),phone:$('#ph').value.trim(),wilaya:$('#wl').value,commune:$('#ct').value.trim(),dtype:$('#dt').value};if(Object.values(o).some(v=>!v))return toast(t('fill'));upd(o)}
function communeField(w,v){return `<select id="cmsel" onchange="ck.commune=this.value;SV('ck',ck)"><option value="">${t('choose')}</option></select>`}
function communeFieldOld(w,v){const l=COMMUNES[w];return l?`<select data-k="commune" onchange="ck.commune=this.value;SV('ck',ck)"><option value="">${t('choose')}</option>${l.map(c=>`<option ${v==c?'selected':''}>${esc(c)}</option>`).join('')}</select>`:`<input data-k="commune" value="${esc(v)}" placeholder="${t('comm')}" oninput="ck.commune=this.value;SV('ck',ck)">`}
function sumHTML(){const l=cart.map(id=>prods.find(p=>p.id==id)).filter(Boolean),sub=l.reduce((a,p)=>a+p.price,0),w=ck.wilaya,sh=ship(w,ck.dtype);return `<div><span>${t('sub')}</span><span>${fmt(sub)}</span></div><div><span>${t('ship')}${w?` (${esc(w)} · ${ck.dtype=='office'?t('of'):t('hm')})`:''}</span><span>${w?fmt(sh):'—'}</span></div><div class="tt"><span>${t('grand')}</span><span>${fmt(sub+sh)}</span></div>`}
function cartV(){const l=cart.map(id=>prods.find(p=>p.id==id)).filter(Boolean);if(!loading){cart=l.map(p=>p.id);SV('cart',cart)}
if(!l.length){$('#app').innerHTML=`<div class="empty"><span class="i">${ic('cart')}</span>${t('ecart')}</div>`;return}
if(me)for(const k of ['fn','ln','phone','wilaya','commune','dtype'])if(!ck[k]&&me[k])ck[k]=me[k];if(!ck.dtype)ck.dtype='home';
const I=(k,lbl,x='')=>`<div><label>${lbl}</label><input data-k="${k}" value="${esc(ck[k])}" ${x} oninput="ck.${k}=this.value;SV('ck',ck)"></div>`;
$('#app').innerHTML=`<div class="box"><h2>${ic('cart')} ${t('cart')}</h2>${l.map(p=>`<div class="row"><div class="th">${p.images?.[0]?`<img src="${su(p.images[0])}">`:catIc(p.cat)}</div><div class="t"><b>${esc(p.title)}</b><br><span class="pr">${fmt(p.price)}</span></div><button class="btn r" onclick="cart=cart.filter(x=>x!='${p.id}');SV('cart',cart);route()">✖</button></div>`).join('')}</div>
<div class="box"><h2>${ic('pin')} ${t('cko')}</h2><div class="f">${I('fn',t('fn'))}${I('ln',t('ln'))}${I('phone',t('ph'),'dir="ltr" inputmode="tel"')}<div><label>${t('wil')} <small>(${t('shipn')})</small></label><select onchange="ck.wilaya=this.value;ck.commune='';SV('ck',ck);fillCom('cmsel',ck.wilaya,'','name_fr');$('#sm').innerHTML=sumHTML()"><option value="">${t('choose')}</option>${W.map(w=>`<option value="${w[0]}" ${ck.wilaya==w[0]?'selected':''}>${w[0]} — ${fmt(rates[w[0]]??w[1])}</option>`).join('')}</select></div><div><label>${t('city')}</label><span id="cm">${communeField(ck.wilaya,ck.commune||'')}</span></div><div><label>${t('dt')}</label><select onchange="ck.dtype=this.value;SV('ck',ck);$('#sm').innerHTML=sumHTML()"><option value="home" ${ck.dtype!='office'?'selected':''}>${t('hm')}</option><option value="office" ${ck.dtype=='office'?'selected':''}>${t('of')}</option></select></div></div></div>
<div class="box sum"><div id="sm">${sumHTML()}</div><button class="btn" id="bb" style="margin-top:10px;width:100%;justify-content:center" onclick="buy()">${ic('check')} ${me?t('conf'):t('nlog')}</button></div>`;if(ck.wilaya)fillCom('cmsel',ck.wilaya,ck.commune,'name_fr')}
async function buy(){for(const x of ['fn','ln','phone','wilaya','commune','dtype'])if(!(ck[x]||'').trim())return toast(t('fill'));if(!/^0[5-7]\d{8}$/.test(ck.phone.replace(/\s/g,'')))return toast(t('badph'));
 if(!me){SV('ck',ck);afterLogin='cart';toast(t('nlog'));return go('login')}
 const b=$('#bb');b.disabled=true;const {error}=await sb.rpc('os_place_order',{p_items:cart,p_info:{fn:ck.fn.trim(),ln:ck.ln.trim(),phone:ck.phone.replace(/\s/g,''),wilaya:ck.wilaya,commune:ck.commune.trim(),dtype:ck.dtype}});
 if(error){b.disabled=false;return err(error)}cart=[];SV('cart',[]);await Promise.all([loadOrders(),loadNotifs()]);toast(t('sent'));go('orders')}
function ord(){const st=i=>i.status=='done'?t('deliv'):i.status=='sent'?t('sentst'):t('pay');$('#app').innerHTML=`<div class="box"><h2>${ic('box')} ${t('orders')}</h2>${myOrders.length?myOrders.map(o=>`<div class="row"><div class="t"><b>#${o.id}</b> · ${new Date(o.created_at).toLocaleDateString(loc())}<br><small>${o.os_items.map(i=>esc(i.title)+` <span class="st2 ${i.status=='done'?'ok':''}">${st(i)}</span>`).join('<br>')}</small></div><b class="pr">${fmt(o.sub+o.ship)}</b></div>`).join(''):`<div class="empty"><span class="i">${ic('box')}</span>${t('noord')}</div>`}</div>`}
const TERMS={ar:[['ما هو OS shop؟','OS shop منصة وسيطة تتيح للبائعين عرض منتجاتهم الرقمية وللمشترين طلبها. المنصة لا تملك المنتجات المعروضة، وكل بائع مسؤول عن منتجه ومحتواه وتسليمه.'],['الحساب والأهلية',['يجب أن يكون عمرك 18 سنة فأكثر، أو أن تستعمل المنصة بإشراف ولي أمرك.','أدخل معلومات صحيحة وحافظ على سرية كلمة مرورك، فأنت المسؤول عن نشاط حسابك.','حساب واحد لكل شخص.']],['ماذا يمكنك أن تفعل؟',['المشتري: تصفح المنتجات، إضافتها للسلة، إدخال معلومات التوصيل، متابعة الطلبات واستلام الإشعارات.','البائع: نشر منتجات (حتى 4 صور)، متابعة الطلبات والإحصائيات، ربط شركة توصيل، وتحديث حالة الطلب.','الجميع: تغيير اللغة والوضع الداكن وإدارة الإعدادات والإشعارات.']],['التزامات البائع',['أن يملك حقوق المنتج أو يملك ترخيصاً ببيعه.','أن يكتب وصفاً صادقاً ومطابقاً للمنتج وسعراً واضحاً.','أن يسلّم الطلب في وقت معقول ويتعامل باحترام مع الزبائن.','أن يحمي بيانات الزبائن ولا يستعملها خارج تنفيذ الطلب.','أن يحافظ على سرية مفاتيح الربط (API) الخاصة به.']],['حقوق المشتري',['الحصول على منتج مطابق للوصف.','حماية بياناته الشخصية واستعمالها فقط لتنفيذ طلبه.','التواصل مع البائع عبر الإيميل أو واتساب، وتقديم شكوى للمطوّر عند وجود مخالفة.']],['المنتجات الرقمية والنزاعات',['المنتج الرقمي بعد تسليمه لا يُسترجع إلا إذا كان مخالفاً للوصف أو معطوباً.','تُحل النزاعات أولاً بين البائع والمشتري، وعند التعذر يمكن مراسلة المطوّر.']],['⛔ المحظورات (ممنوع بيعها أو نشرها)',['البرمجيات الخبيثة وأدوات الاختراق وسرقة الحسابات أو كلمات المرور.','المحتوى المقرصن أو المنسوخ دون ترخيص (كتب، دورات، برامج، تصاميم، موسيقى، أفلام).','الحسابات أو البطاقات البنكية أو البيانات الشخصية المسروقة أو المشتراة بطرق غير قانونية.','المحتوى الإباحي أو العنيف أو المحرّض على الكراهية والتمييز.','المخدرات والأسلحة وكل ما يمنعه القانون الجزائري.','الوثائق الرسمية المزورة والشهادات المزيفة.','الاحتيال والتصيّد والمنتجات الوهمية أو المضلّلة والإعلانات الكاذبة.','المقامرة والرهان غير القانوني والأنظمة الهرمية.','استعمال صور أو أسماء الغير دون إذن.']],['حقوق الملكية',['اسم OS shop وشعاره وتصميم المنصة ملك لأصحابها ولا يجوز نسخها.','المنتجات المعروضة ملك لأصحابها الأصليين.']],['الخصوصية والبيانات','نحفظ البيانات الضرورية فقط (الاسم، الهاتف، الولاية، البلدية، الإيميل) لتنفيذ الطلبات وتشغيل الحساب، ولا نبيعها لأي طرف. بيانات ربط شركات التوصيل تخص البائع وحده.'],['الطلبات والتوصيل','أسعار التوصيل تختلف حسب الولاية ونوع التوصيل (منزل أو مكتب) وقد تتغير. ربط شركة التوصيل وإرسال الطرود مسؤولية البائع.'],['حدود المسؤولية','المنصة وسيط تقني ولا تضمن جودة منتجات البائعين، ولا تتحمل خسائر ناتجة عن مخالفة بائع أو تأخر شركة توصيل.'],['الإيقاف والمخالفات','يحق للإدارة حذف أي منتج مخالف وإيقاف الحساب دون إشعار مسبق عند تكرار المخالفة أو خطورتها.'],['القانون المطبّق وتعديل الشروط','تخضع هذه الشروط للقوانين الجزائرية. يجوز تعديلها في أي وقت، واستمرارك في استعمال المنصة يعني قبولك للتعديلات.']],
fr:[['Qu’est-ce que OS shop ?','OS shop est une plateforme intermédiaire où les vendeurs proposent des produits numériques et les acheteurs les commandent. La plateforme ne détient pas les produits : chaque vendeur est responsable de son produit, de son contenu et de sa livraison.'],['Compte et éligibilité',['Vous devez avoir 18 ans ou utiliser la plateforme sous la supervision d’un tuteur.','Fournissez des informations exactes et gardez votre mot de passe secret : vous êtes responsable de l’activité de votre compte.','Un seul compte par personne.']],['Ce que vous pouvez faire',['Acheteur : parcourir les produits, remplir le panier, saisir les informations de livraison, suivre les commandes et recevoir des notifications.','Vendeur : publier des produits (4 images max), suivre commandes et statistiques, relier une société de livraison et mettre à jour les commandes.','Tous : changer la langue, le mode sombre, les paramètres et notifications.']],['Obligations du vendeur',['Détenir les droits du produit ou une licence de vente.','Fournir une description honnête et un prix clair.','Livrer dans un délai raisonnable et respecter les clients.','Protéger les données des clients et ne les utiliser que pour exécuter la commande.','Garder secrètes ses clés d’API.']],['Droits de l’acheteur',['Recevoir un produit conforme à la description.','Voir ses données personnelles protégées et utilisées uniquement pour sa commande.','Contacter le vendeur par e-mail ou WhatsApp et signaler un abus au développeur.']],['Produits numériques et litiges',['Un produit numérique livré n’est remboursable que s’il est non conforme ou défectueux.','Les litiges se règlent d’abord entre vendeur et acheteur, puis auprès du développeur si nécessaire.']],['⛔ Interdits (vente et publication)',['Logiciels malveillants, outils de piratage, vol de comptes ou de mots de passe.','Contenu piraté ou copié sans licence (livres, cours, logiciels, designs, musique, films).','Comptes, cartes bancaires ou données personnelles volés ou obtenus illégalement.','Contenu pornographique, violent ou incitant à la haine ou à la discrimination.','Drogues, armes et tout ce que la loi algérienne interdit.','Faux documents officiels et faux diplômes.','Fraude, hameçonnage, produits fictifs ou trompeurs, publicités mensongères.','Jeux d’argent illégaux et systèmes pyramidaux.','Utilisation d’images ou de noms de tiers sans autorisation.']],['Propriété intellectuelle',['Le nom OS shop, son logo et le design de la plateforme appartiennent à leurs titulaires et ne peuvent être copiés.','Les produits restent la propriété de leurs auteurs.']],['Vie privée et données','Nous ne conservons que les données nécessaires (nom, téléphone, wilaya, commune, e-mail) pour traiter les commandes et gérer le compte, et nous ne les vendons pas. Les identifiants des sociétés de livraison appartiennent au vendeur seul.'],['Commandes et livraison','Les frais de livraison varient selon la wilaya et le type (domicile ou bureau) et peuvent changer. Le lien avec la société de livraison et l’expédition relèvent du vendeur.'],['Limitation de responsabilité','La plateforme est un intermédiaire technique : elle ne garantit pas la qualité des produits et n’est pas responsable des pertes causées par un vendeur fautif ou une société de livraison.'],['Suspension et infractions','L’administration peut supprimer tout produit non conforme et suspendre un compte sans préavis en cas d’infraction répétée ou grave.'],['Droit applicable et modifications','Ces conditions sont régies par le droit algérien. Elles peuvent être modifiées à tout moment ; continuer à utiliser la plateforme vaut acceptation.']],
en:[['What is OS shop?','OS shop is an intermediary platform where sellers list digital products and buyers order them. The platform does not own the listed products: each seller is responsible for their product, its content and its delivery.'],['Account & eligibility',['You must be 18 or older, or use the platform under a guardian’s supervision.','Provide accurate information and keep your password secret; you are responsible for activity on your account.','One account per person.']],['What you can do',['Buyer: browse products, fill the cart, enter delivery details, track orders and receive notifications.','Seller: publish products (up to 4 images), follow orders and stats, link a delivery company and update order status.','Everyone: change language, dark mode, settings and notifications.']],['Seller obligations',['Own the rights to the product or hold a licence to sell it.','Write an honest description and a clear price.','Deliver within a reasonable time and treat customers with respect.','Protect customer data and use it only to fulfil the order.','Keep API keys confidential.']],['Buyer rights',['Receive a product that matches its description.','Have personal data protected and used only for their order.','Contact the seller by email or WhatsApp, and report abuse to the developer.']],['Digital goods & disputes',['A delivered digital product is refundable only if it does not match the description or is defective.','Disputes are resolved first between seller and buyer, then with the developer if needed.']],['⛔ Prohibited (selling or posting)',['Malware, hacking tools, stolen accounts or passwords.','Pirated or unlicensed content (books, courses, software, designs, music, films).','Stolen or illegally obtained accounts, bank cards or personal data.','Pornographic or violent content, or content inciting hatred or discrimination.','Drugs, weapons and anything prohibited by Algerian law.','Forged official documents and fake certificates.','Fraud, phishing, fake or misleading products and false advertising.','Illegal gambling and pyramid schemes.','Using other people’s images or names without permission.']],['Intellectual property',['The OS shop name, logo and platform design belong to their owners and may not be copied.','Listed products remain the property of their authors.']],['Privacy & data','We keep only the data needed (name, phone, wilaya, commune, email) to process orders and run your account, and we never sell it. Delivery-company credentials belong to the seller alone.'],['Orders & delivery','Delivery prices vary by wilaya and type (home or office) and may change. Linking a delivery company and shipping parcels is the seller’s responsibility.'],['Limitation of liability','The platform is a technical intermediary: it does not guarantee sellers’ product quality and is not liable for losses caused by a seller’s breach or a delivery company’s delay.'],['Suspension & violations','Administrators may remove any violating product and suspend an account without notice for repeated or serious violations.'],['Governing law & changes','These terms are governed by Algerian law. They may be updated at any time; continued use means you accept the changes.']]};
function terms(){const D=TERMS[lang]||TERMS.ar;$('#app').innerHTML=`<div class="th2"><span class="ib">${ic('scroll')}</span><h2>${t('rules')}</h2></div>`+D.map(([h,b],i)=>{const bad=h.includes('⛔');return `<details class="ac ${bad?'bad':''} rv" ${i==0?'open':''}><summary>${bad?ic('ban'):`<span class="gn sm">${i+1}</span>`}<span>${h.replace('⛔ ','')}</span><i class="chev"></i></summary>${Array.isArray(b)?`<ul>${b.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<p class="acp">${b}</p>`}</details>`}).join('')+`<div class="box" style="text-align:center"><h3>${ic('mail')} ${t('devc')}</h3><p><a href="mailto:oussmakaddch@gmail.com" dir="ltr">oussmakaddch@gmail.com</a></p><p style="color:var(--mu);font-size:12px">${t('disc')}</p></div>`}
function guide(){const el=$('#guide');if(!el)return;if(cur=='terms'){el.innerHTML='';return}const D=TERMS[lang]||TERMS.ar,L=i=>D[i][1];
const st=[1,2,3,4].map(i=>`<div class="gs"><span class="gn">${i}</span><div><b>${t('as'+i)}</b><p>${t('ad'+i)}</p></div></div>`).join('');
const card=(i,ti,it,c)=>`<details class="ac ${c}"><summary>${ic(i)}<span>${ti}</span><i class="chev"></i></summary><ul>${it.map(x=>`<li>${x}</li>`).join('')}</ul></details>`;
el.innerHTML=`<div class="gd"><div class="gh"><span class="ib">${ic('scroll')}</span><h2>${t('gdt')}</h2><p>${t('gds')}</p></div><div class="box gst"><h3>${ic('user')} ${t('acc0')}</h3><div class="gsl">${st}</div></div><div class="gcs">${card('store',t('cs'),L(3),'')}${card('bag',t('cb'),L(4),'')}${card('ban',t('cp'),L(6),'bad')}</div><div style="text-align:center;margin-top:16px"><a class="btn" href="#terms">${ic('scroll')} ${t('seemore')}</a></div></div>`}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){const e=x.target;e.classList.add('in');io.unobserve(e);setTimeout(()=>{e.classList.remove('rv','in');e.style.transitionDelay=''},1100)}}),{threshold:.08}):null;
function reveal(){if(!io)return;document.querySelectorAll('.card,.box,.st,.feat div,.step,.gs,.ac:not(.rv),.gh').forEach((e,i)=>{e.classList.add('rv');e.style.transitionDelay=(i%8)*70+'ms';io.observe(e)})}
document.addEventListener('pointermove',e=>{const c=e.target.closest?.('.card');if(!c||e.pointerType!='mouse')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-6px)`});
document.addEventListener('pointerout',e=>{const c=e.target.closest?.('.card');if(c&&!c.contains(e.relatedTarget))c.style.transform=''});
document.addEventListener('click',e=>{const b=e.target.closest?.('.btn');if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height);s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.append(s);setTimeout(()=>s.remove(),600)});
addEventListener('hashchange',route);init();
</script>
